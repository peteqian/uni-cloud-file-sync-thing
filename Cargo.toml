[workspace]
resolver = "2"
members = [
    "crates/cloudsync-core",
    "crates/cloudsync-config",
    "crates/cloudsync-db",
    "crates/cloudsync-ipc",
    "crates/cloudsync-providers",
    "crates/cloudsync-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CloudSync Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/peteqian/uni-cloud-file-sync-thing"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# File watching
notify = "6.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Secret storage
keyring = "2.3"

# CLI
clap = { version = "4.4", features = ["derive"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# URL handling
url = { version = "2.5", features = ["serde"] }

# Google Drive API
google-drive3 = "7.0.0"
yup-oauth2 = "12.1"
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http2", "ring", "rustls-native-certs"] }
http-body-util = "0.1"

# Path handling
directories = "5.0"

# Environment variables
dotenvy = "0.15"

# Testing
tempfile = "3.9"

# Internal crates
cloudsync-core = { path = "crates/cloudsync-core" }
cloudsync-config = { path = "crates/cloudsync-config" }
cloudsync-db = { path = "crates/cloudsync-db" }
cloudsync-ipc = { path = "crates/cloudsync-ipc" }
cloudsync-providers = { path = "crates/cloudsync-providers" }

[profile.release]
lto = true
codegen-units = 1
strip = true
